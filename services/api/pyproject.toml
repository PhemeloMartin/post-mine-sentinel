[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-api"
version = "0.1.0"
description = "Post-Mine Sentinel core API: register, sensing ingest, Bayesian fusion, alerts, planning, audit"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic>=2.9,<3",
    "pydantic-settings==2.6.1",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "cryptography>=43",
    "prometheus-client==0.21.0",
    "httpx>=0.27",
    "sentinel-ml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:dash -p no:anyio"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
