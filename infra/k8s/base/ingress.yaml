apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"            # coarse DoS protection at the edge
    nginx.ingress.kubernetes.io/whitelist-source-range: "${SOC_EGRESS_CIDRS}"  # console reachable from SOC networks only
spec:
  ingressClassName: nginx
  tls: [{ hosts: ["${CONSOLE_HOST}"], secretName: sentinel-tls }]
  rules:
    - host: "${CONSOLE_HOST}"
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: console, port: { number: 80 } } } }
