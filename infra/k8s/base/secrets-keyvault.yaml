# Secrets are never stored in Git or in Kubernetes etcd as plain Secrets authored by humans:
# the Azure Key Vault provider for the Secrets Store CSI driver mounts them at runtime using the
# pod's workload identity, and syncs a K8s Secret only for env-var consumption.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sentinel-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}"   # substituted by the deploy pipeline
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: ingest-token
          objectType: secret
        - |
          objectName: evidence-signing-key
          objectType: secret
        - |
          objectName: silknet-site-keys
          objectType: secret
        - |
          objectName: cases-connection-string
          objectType: secret
  secretObjects:
    - secretName: sentinel-runtime
      type: Opaque
      data:
        - { objectName: database-url, key: SENTINEL_DATABASE_URL }
        - { objectName: jwt-secret, key: SENTINEL_JWT_SECRET }
        - { objectName: ingest-token, key: SENTINEL_INGEST_TOKEN }
        - { objectName: evidence-signing-key, key: SENTINEL_EVIDENCE_SIGNING_KEY_HEX }
        - { objectName: cases-connection-string, key: ConnectionStrings__Cases }
