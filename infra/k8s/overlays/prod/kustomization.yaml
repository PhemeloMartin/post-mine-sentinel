apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# The release pipeline pins immutable digests here (never "latest" in production).
images:
  - { name: sentinel-api, newTag: "0.1.0" }
  - { name: sentinel-ingest, newTag: "0.1.0" }
  - { name: sentinel-cases, newTag: "0.1.0" }
  - { name: sentinel-console, newTag: "0.1.0" }
patches:
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: Deployment, name: case-service }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
