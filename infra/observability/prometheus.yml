global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /api/v1/metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: sentinel-ingest
    static_configs: [{ targets: ["ingest:9102"] }]
