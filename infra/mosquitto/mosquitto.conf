# Development broker. Production (infra/k8s) uses listener 8883 with mutual TLS: every anchor
# gateway has its own client certificate (CN = gateway id) and the ACL pins it to its site topic.
listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl
persistence false
max_inflight_messages 100
max_queued_messages 5000
log_dest stdout
log_type warning
log_type notice
