; S.P.I.D.E.R. node firmware (Seismic & Passive-Infrared Detection, Edge Relay)
;   pio run -e heltec_v3            build for the prototype board (ESP32-S3 + SX1262)
;   pio run -e heltec_v3 -t upload  flash over USB
;   pio test -e native              host unit tests (crypto, protocol, DSP/ML parity)

[platformio]
default_envs = heltec_v3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
lib_deps =
    jgromes/RadioLib@7.1.2
    adafruit/Adafruit ADS1X15@2.5.0
    adafruit/Adafruit LIS3DH@1.3.0
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=2
    -DSPIDER_FW_VERSION=\"0.1.0\"

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = ${env.build_flags} -O2
